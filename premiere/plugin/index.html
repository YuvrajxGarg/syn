<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="top">
        <div class="brand" id="mark"></div>
        <div class="status" data-action="reconnect">
          <div class="dot" id="dot"></div>
          <div class="status-text" id="status-text">Looking for Syn…</div>
        </div>
      </div>

      <div class="banner hidden" id="banner">
        <div class="banner-text" id="banner-text"></div>
        <div class="btn small hidden" id="banner-btn" data-action="pair">Connect</div>
      </div>

      <div class="btn primary big" id="sync" data-action="sync">Sync</div>
      <div class="sub" id="sub"></div>

      <div class="card hidden" id="card">
        <div class="hidden" id="wave-box"><div id="wave"></div></div>
        <div id="card-body"></div>
      </div>
      <div class="error hidden" id="error"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
